<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nichodev.com</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      padding: 24px;
      background: #fff;
      color: #000;
      font-family: "Press Start 2P", monospace;
    }

    h1 {
      font-size: clamp(16px, 4vw, 32px);
      font-weight: 400;
      text-align: center;
      animation: piscar 1s steps(1, end) infinite;
    }

    .cursor {
      display: inline-block;
      width: .65em;
      height: 1em;
      margin-left: .2em;
      background: currentColor;
      vertical-align: -.12em;
    }

    .api-button {
      padding: 14px 18px;
      border: 2px solid currentColor;
      background: #fff;
      color: #000;
      font: inherit;
      font-size: clamp(9px, 2vw, 11px);
      line-height: 1.6;
      cursor: pointer;
      transition: background-color .15s, color .15s, transform .15s;
    }

    .api-button:hover,
    .api-button:focus-visible {
      background: #000;
      color: #fff;
    }

    .api-button:active {
      transform: translateY(2px);
    }

    .api-button:focus-visible {
      outline: 2px dashed #000;
      outline-offset: 5px;
    }

    .api-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .api-status {
      max-width: 90vw;
      font: 14px/1.5 monospace;
      text-align: center;
      overflow-wrap: anywhere;
    }

    @keyframes piscar {
      50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      h1 { animation: none; }
      .api-button { transition: none; }
    }
  </style>
</head>

<body>
  <h1>nichodev.com<span class="cursor" aria-hidden="true"></span></h1>

  <button class="api-button" id="startButton" type="button">
    START
  </button>

  <p class="api-status" id="apiStatus" role="status" aria-live="polite"></p>

  <script>
    const button = document.getElementById("startButton");
    const status = document.getElementById("apiStatus");

    window.addEventListener("pageshow", () => {
      button.disabled = false;
      status.textContent = "";
    });

    button.addEventListener("click", async () => {
      button.disabled = true;
      status.textContent = "CONECTANDO À API...";

      try {
        const response = await fetch("/api/status", {
          cache: "no-store"
        });

        if (!response.ok || (await response.json()).status !== "ok") {
          throw new Error("API indisponível");
        }

        status.textContent = "CONEXÃO OK! ABRINDO ESTÚDIO...";
        window.location.href = "voz.html";
      } catch {
        status.textContent = "ERRO AO CONECTAR À API. TENTE NOVAMENTE.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
