<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nichodev.com</title>
  <meta name="description" content="Estúdio de voz no navegador: mude o tom e aplique efeitos em tempo real ou em áudios gravados.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='4' y='3' width='8' height='10' fill='%23fff'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      padding: 24px;
    }

    h1 {
      font-size: clamp(16px, 4vw, 32px);
      font-weight: 400;
      text-align: center;
    }

    .btn {
      font-size: clamp(9px, 2vw, 11px);
      border-width: 2px;
      padding: 14px 18px;
    }
  </style>
</head>
<body>
  <h1>nichodev.com</h1>

  <a class="btn" href="voz.html" aria-label="Abrir estúdio de voz" id="startBtn">START</a>

<script>
document.getElementById("startBtn").addEventListener("click", function () {
  const AudioContextClass =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioContextClass) return;

  const audio = new AudioContextClass();

  const notas = [
    { frequencia: 440, inicio: 0, duracao: 0.08 },
    { frequencia: 660, inicio: 0.09, duracao: 0.12 }
  ];

  notas.forEach(nota => {
    const oscilador = audio.createOscillator();
    const volume = audio.createGain();

    const inicio = audio.currentTime + nota.inicio;
    const fim = inicio + nota.duracao;

    oscilador.type = "square";
    oscilador.frequency.value = nota.frequencia;

    volume.gain.setValueAtTime(0.12, inicio);
    volume.gain.exponentialRampToValueAtTime(0.001, fim);

    oscilador.connect(volume);
    volume.connect(audio.destination);

    oscilador.start(inicio);
    oscilador.stop(fim);
  });

  setTimeout(() => audio.close(), 500);
});
</script>

</body>
</html>
