<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nichodevs</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      padding: 24px;
      background: #ffffff;
      color: #000000;
      font-family: "Press Start 2P", monospace;
    }

    h1 {
      font-size: clamp(16px, 4vw, 32px);
      font-weight: 400;
      text-align: center;
    }

    .cursor {
      display: inline-block;
      width: 0.65em;
      height: 1em;
      background-color: #000000;
      margin-left: 0.2em;
      vertical-align: -0.12em;
      animation: piscar 1s steps(1, end) infinite;
    }

    .api-button {
      display: inline-block;
      text-decoration: none;
      text-align: center;
      padding: 14px 18px;
      border: 2px solid #000000;
      border-radius: 0;
      background: #ffffff;
      color: #000000;
      font-family: inherit;
      font-size: clamp(9px, 2vw, 11px);
      line-height: 1.6;
      cursor: pointer;
      transition: background-color 150ms ease, color 150ms ease, transform 150ms ease;
    }

    .api-button:hover,
    .api-button:focus-visible {
      background: #000000;
      color: #ffffff;
    }

    .api-button:active {
      transform: translateY(2px);
    }

    .api-button:focus-visible {
      outline: 2px dashed #000000;
      outline-offset: 5px;
    }

    .api-status {
      max-width: 90vw;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      overflow-wrap: anywhere;
    }

    @keyframes piscar {
      50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
      .api-button { transition: none; }
    }
  </style>
</head>
<body>
  <h1>nichodevs<span class="cursor" aria-hidden="true"></span></h1>

  <a class="api-button" href="voz.html">START</a>
</body>
</html>
