name: Compilar plugin de áudio

on:
  pull_request:
    branches:
      - main
    paths:
      - "plugin/**"
      - ".github/workflows/plugin.yml"
  push:
    branches:
      - main
    paths:
      - "plugin/**"
      - ".github/workflows/plugin.yml"

permissions:
  contents: read

jobs:
  build:
    name: VST3 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências de compilação (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype6-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxrender-dev \
            libxfixes-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-3-dev \
            libjack-jackd2-dev

      - name: Configurar CMake e baixar JUCE
        run: cmake -S plugin -B build/plugin -DCMAKE_BUILD_TYPE=Release

      - name: Compilar bundle VST3
        run: cmake --build build/plugin --config Release --target NichodevGuitarFX_VST3
