name: Publicar site na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Validar site antes da publicação
        run: npm run check

      - name: Conferir secrets do SFTP
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USERNAME }}
          PASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST_KEYS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          test -n "$HOST" || { echo "::error::Configure o secret HOSTINGER_HOST."; exit 1; }
          test -n "$USER" || { echo "::error::Configure o secret HOSTINGER_USERNAME."; exit 1; }
          test -n "$PASS" || { echo "::error::Configure o secret HOSTINGER_PASSWORD."; exit 1; }
          test -n "$HOST_KEYS" || { echo "::error::Configure o secret HOSTINGER_KNOWN_HOSTS."; exit 1; }

      - name: Instalar cliente SFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Preparar chave de host SFTP verificada
        env:
          HOST_KEYS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOST_KEYS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Publicar arquivos na Hostinger
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          lftp --env-password -u "$USER" "sftp://$HOST:65002" -e "
            set sftp:auto-confirm no
            set net:timeout 20
            set net:max-retries 2
            set cmd:fail-exit yes
            cd domains/nichodev.com/public_html
            put style.css -o style.css
            put index.css -o index.css
            put voz.css -o voz.css
            put voz-compacto.css -o voz-compacto.css
            put cursores-retro.css -o cursores-retro.css
            put guitarra-8bit.css -o guitarra-8bit.css
            put mixmaster.css -o mixmaster.css
            put cursor.png -o cursor.png
            put cursor-pointer.png -o cursor-pointer.png
            put cursor-text.png -o cursor-text.png
            put cursor-move.png -o cursor-move.png
            put cursor-wait.png -o cursor-wait.png
            put cursor-not-allowed.png -o cursor-not-allowed.png
            put cursor-resize-h.png -o cursor-resize-h.png
            put cursor-resize-v.png -o cursor-resize-v.png
            put cursor-crosshair.png -o cursor-crosshair.png
            put cursor-help.png -o cursor-help.png
            put cursor-alt.png -o cursor-alt.png
              set cmd:fail-exit no
            mkdir js
            set cmd:fail-exit yes
            put js/index.js -o js/index.js
            put js/voz.js -o js/voz.js
            put js/guitarra.js -o js/guitarra.js
            put js/back-sound.js -o js/back-sound.js
            put js/mixmaster.js -o js/mixmaster.js
            put robots.txt -o robots.txt
            put index.html -o index.html
            put voz.html -o voz.html
            put guitarra.html -o guitarra.html
            put mixmaster.html -o mixmaster.html
            rm -f modular-fx.html modular-fx.css js/modular-fx.js js/compact-mode.js
            bye
          "

      - name: Conferir páginas e arquivos publicados
        env:
          SITE_URL: https://nichodev.com
        run: |
          paths=(
            /
            /voz.html
            /guitarra.html
            /mixmaster.html
            /style.css
            /index.css
            /voz.css
            /voz-compacto.css
            /guitarra-8bit.css
            /mixmaster.css
            /cursores-retro.css
            /js/index.js
            /js/voz.js
            /js/guitarra.js
            /js/back-sound.js
            /js/mixmaster.js
            /cursor.png
            /cursor-pointer.png
          )
          for path in "${paths[@]}"; do
            echo "Conferindo $path"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 \
              --output /dev/null "$SITE_URL$path"
          done
