name: Publicar site na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Instalar cliente SFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Publicar arquivos na Hostinger
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USERNAME }}
          PASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          lftp -u "$USER","$PASS" "sftp://$HOST:65002" -e "
            set sftp:auto-confirm yes
            cd domains/nichodev.com/public_html
            put index.html -o index.html
            put voz.html -o voz.html
            put voz.css -o voz.css
            put voz-compacto.css -o voz-compacto.css
            mkdir -p js
            put js/voz.js -o js/voz.js
            put robots.txt -o robots.txt
            rm -f modular-fx.html modular-fx.css js/modular-fx.js
            bye
          "
