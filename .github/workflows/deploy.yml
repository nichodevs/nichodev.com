name: Publicar site na Hostinger

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - "public/**"
      - "!public/**/*.md"
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v7

      - name: Conferir secrets do SFTP
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USERNAME }}
          PASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST_KEYS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          test -n "$HOST" || { echo "::error::Configure o secret HOSTINGER_HOST."; exit 1; }
          test -n "$USER" || { echo "::error::Configure o secret HOSTINGER_USERNAME."; exit 1; }
          test -n "$PASS" || { echo "::error::Configure o secret HOSTINGER_PASSWORD."; exit 1; }
          test -n "$HOST_KEYS" || { echo "::error::Configure o secret HOSTINGER_KNOWN_HOSTS."; exit 1; }

      - name: Instalar cliente SFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Preparar chave de host SFTP verificada
        env:
          HOST_KEYS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOST_KEYS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Publicar arquivos na Hostinger
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          lftp --env-password -u "$USER" "sftp://$HOST:65002" -e "
            set sftp:auto-confirm no
            set net:timeout 20
            set net:max-retries 2
            set cmd:fail-exit yes
            cd domains/nichodev.com/public_html
            # SFTP may report an existing directory as Failure; verify every destination afterwards.
            set cmd:fail-exit no
            mkdir -p assets
            mkdir -p assets/cursors
            mkdir -p js
            mkdir -p onda
            set cmd:fail-exit yes
            cd assets/cursors
            cd ../..
            cd js
            cd ..
            cd onda
            cd ..
            put public/style.css -o style.css
            put public/index.css -o index.css
            put public/voz.css -o voz.css
            put public/voz-compacto.css -o voz-compacto.css
            put public/cursores-retro.css -o cursores-retro.css
            put public/guitarra-8bit.css -o guitarra-8bit.css
            put public/mixmaster.css -o mixmaster.css
            put public/assets/cursors/cursor.png -o assets/cursors/cursor.png
            put public/assets/cursors/cursor-pointer.png -o assets/cursors/cursor-pointer.png
            put public/assets/cursors/cursor-text.png -o assets/cursors/cursor-text.png
            put public/assets/cursors/cursor-move.png -o assets/cursors/cursor-move.png
            put public/assets/cursors/cursor-wait.png -o assets/cursors/cursor-wait.png
            put public/assets/cursors/cursor-not-allowed.png -o assets/cursors/cursor-not-allowed.png
            put public/assets/cursors/cursor-resize-h.png -o assets/cursors/cursor-resize-h.png
            put public/assets/cursors/cursor-resize-v.png -o assets/cursors/cursor-resize-v.png
            put public/assets/cursors/cursor-crosshair.png -o assets/cursors/cursor-crosshair.png
            put public/assets/cursors/cursor-alt.png -o assets/cursors/cursor-alt.png
            put public/js/index.js -o js/index.js
            put public/js/voz.js -o js/voz.js
            put public/js/guitarra.js -o js/guitarra.js
            put public/js/back-sound.js -o js/back-sound.js
            put public/js/mixmaster.js -o js/mixmaster.js
            put public/robots.txt -o robots.txt
            put public/index.html -o index.html
            put public/voz.html -o voz.html
            put public/guitarra.html -o guitarra.html
            put public/mixmaster.html -o mixmaster.html
            put public/onda/index.html -o onda/index.html
            put public/onda/onda.css -o onda/onda.css
            put public/onda/onda.js -o onda/onda.js
            rm -f cursor-alt.png cursor-crosshair.png cursor-help.png cursor-move.png cursor-not-allowed.png cursor-pointer.png cursor-resize-h.png cursor-resize-v.png cursor-text.png cursor-wait.png cursor.png
            rm -f assets/cursors/cursor-help.png
            rm -f voz.js modular-fx.html modular-fx.css js/modular-fx.js js/compact-mode.js
            bye
          "

      - name: Conferir páginas e arquivos publicados
        env:
          SITE_URL: https://nichodev.com
        run: |
          paths=(
            /
            /voz.html
            /guitarra.html
            /mixmaster.html
            /onda/
            /onda/onda.css
            /onda/onda.js
            /style.css
            /index.css
            /voz.css
            /voz-compacto.css
            /guitarra-8bit.css
            /mixmaster.css
            /cursores-retro.css
            /js/index.js
            /js/voz.js
            /js/guitarra.js
            /js/back-sound.js
            /js/mixmaster.js
            /assets/cursors/cursor-alt.png
            /assets/cursors/cursor-crosshair.png
            /assets/cursors/cursor-move.png
            /assets/cursors/cursor-not-allowed.png
            /assets/cursors/cursor-pointer.png
            /assets/cursors/cursor-resize-h.png
            /assets/cursors/cursor-resize-v.png
            /assets/cursors/cursor-text.png
            /assets/cursors/cursor-wait.png
            /assets/cursors/cursor.png
          )
          for path in "${paths[@]}"; do
            echo "Conferindo $path"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 \
              --output /dev/null "$SITE_URL$path"
          done
