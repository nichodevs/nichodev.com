
name: Publicar site na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Instalar cliente SFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Enviar arquivos para a Hostinger
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USERNAME }}
          PASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          lftp -u "$USER","$PASS" "sftp://$HOST:65002" -e "
            set sftp:auto-confirm yes
            pwd
            ls
            bye
          "
