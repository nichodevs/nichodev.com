name: Verificar comunidade pública
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
concurrency:
  group: community-public-health
  cancel-in-progress: false
jobs:
  health:
    if: vars.COMMUNITY_PRODUCTION_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Conferir serviço por fora da hospedagem
        run: node scripts/check-public-community.cjs
