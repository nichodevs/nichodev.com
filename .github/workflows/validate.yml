name: Validar site

on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias registradas no lockfile
        run: npm ci

      - name: Testar o validador de módulos e publicação
        run: npm test

      - name: Validar site e arquivos do deploy
        run: npm run check

      - name: Instalar Chromium, Firefox e WebKit para os testes
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Preparar saída de áudio virtual para os navegadores
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=nichodev_ci
          pactl set-default-sink nichodev_ci
          pactl info

      - name: Testar interface, edição e processamento de áudio
        run: npm run test:e2e

      - name: Testar prévia isolada da comunidade
        run: npm run test:preview

      - name: Guardar diagnóstico de testes que falharam
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar prévia da comunidade para homologação
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: nichodev-community-preview
          path: prototypes/community/
          retention-days: 14
