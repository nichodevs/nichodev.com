name: Validar site

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Validar site e arquivos do deploy
        run: npm run check
