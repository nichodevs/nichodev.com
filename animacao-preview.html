<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Prévia da animação — nichodev.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #000;
      --fg: #fff;
      --line: #fff;
      --font: "Press Start 2P", "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
    }

    h1 {
      margin: 0;
      font-size: clamp(16px, 4vw, 32px);
      font-weight: 400;
      text-align: center;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    .btn {
      display: inline-block;
      max-width: 100%;
      padding: 14px 18px;
      border: 2px solid var(--line);
      color: var(--fg);
      background: var(--bg);
      font: inherit;
      font-size: clamp(9px, 2vw, 11px);
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 150ms ease, color 150ms ease, transform 150ms ease;
    }

    .btn:hover {
      background: var(--fg);
      color: var(--bg);
    }

    .btn:active { transform: translateY(2px); }

    .repository-qr-card {
      margin-bottom: 1em;
      padding: 10px;
      display: grid;
      justify-items: center;
      gap: 8px;
      border: 2px solid var(--fg);
      background: var(--bg);
      text-align: center;
    }

    .repository-qr-card h2,
    .repository-qr-card p {
      margin: 0;
      font-size: 7px;
      line-height: 1.7;
    }

    .qr-placeholder {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border: 4px solid #fff;
      background:
        linear-gradient(90deg, #000 50%, transparent 50%) 0 0 / 8px 8px,
        linear-gradient(#000 50%, transparent 50%) 0 0 / 8px 8px,
        #fff;
      image-rendering: pixelated;
    }

    .qr-placeholder span {
      padding: 3px;
      color: #fff;
      background: #000;
      font-size: 7px;
    }

    .site-footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-size: 9px;
      text-align: center;
    }

    .site-footer a {
      padding-bottom: 5px;
      border-bottom: 2px solid currentColor;
      color: var(--fg);
      text-decoration: none;
    }

    .site-footer p { margin: 0; font-size: 7px; }

    .preview-controls {
      position: fixed;
      top: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .preview-controls .btn { padding: 10px 12px; font-size: 8px; }
    .preview-label { font-size: 7px; }

    body.playing h1,
    body.playing #startBtn,
    body.playing #selectBtn,
    body.playing #mixBtn,
    body.playing .repository-qr-card,
    body.playing .site-footer {
      opacity: 0;
      animation: none;
    }

    body.playing h1 { animation: home-enter 520ms cubic-bezier(.2, .75, .3, 1) both; }
    body.playing #startBtn { animation: home-enter 520ms 90ms cubic-bezier(.2, .75, .3, 1) both; }
    body.playing #selectBtn { animation: home-enter 520ms 170ms cubic-bezier(.2, .75, .3, 1) both; }
    body.playing #mixBtn { animation: home-enter 520ms 250ms cubic-bezier(.2, .75, .3, 1) both; }
    body.playing .repository-qr-card { animation: home-enter 520ms 330ms cubic-bezier(.2, .75, .3, 1) both; }
    body.playing .site-footer { animation: home-enter 520ms 410ms cubic-bezier(.2, .75, .3, 1) both; }

    @keyframes home-enter {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      body.playing h1,
      body.playing #startBtn,
      body.playing #selectBtn,
      body.playing #mixBtn,
      body.playing .repository-qr-card,
      body.playing .site-footer {
        animation: none;
        opacity: 1;
        transform: none;
      }
      .btn { transition: none; }
    }

    @media (max-width: 480px) {
      body { gap: 22px; }
      .preview-controls { position: static; order: -1; }
    }
  </style>
</head>
<body class="playing">
  <div class="preview-controls">
    <span class="preview-label">PRÉVIA — NÃO ALTERA A INICIAL</span>
    <button class="btn" id="replayBtn" type="button">REPETIR</button>
  </div>

  <h1>nichodev.com</h1>

  <nav class="menu" aria-label="Menu principal">
    <a class="btn" href="voz.html" id="startBtn">START</a>
    <a class="btn" href="guitarra.html" id="selectBtn">SELECT</a>
    <a class="btn" href="mixmaster.html" id="mixBtn">MIX/MASTER</a>
  </nav>

  <section class="repository-qr-card" aria-labelledby="repositoryQrTitle">
    <h2 id="repositoryQrTitle">ACESSO AO REPOSITÓRIO</h2>
    <a href="https://github.com/nichodevs/nichodev.com" target="_blank" rel="noopener noreferrer" aria-label="Abrir o repositório no GitHub">
      <div class="qr-placeholder" aria-hidden="true"><span>QR</span></div>
    </a>
    <p>QR ILUSTRATIVO — PRÉVIA VISUAL</p>
  </section>

  <footer class="site-footer">
    <p>Start - Voz / Select - Guitarra / MIX/MASTER - Editor de áudio</p>
    <a href="https://github.com/nichodevs/nichodev.com" target="_blank" rel="noopener noreferrer">GITHUB ↗</a>
    <p>© 2026 nichodev.com</p>
    <a href="index.html">VOLTAR À PÁGINA INICIAL</a>
  </footer>

  <script>
    const replayButton = document.getElementById("replayBtn");
    replayButton.addEventListener("click", () => {
      document.body.classList.remove("playing");
      void document.body.offsetWidth;
      document.body.classList.add("playing");
    });

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.body.classList.remove("playing");
    }
  </script>
</body>
</html>
